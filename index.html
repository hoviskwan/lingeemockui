<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingee · AI 开发能力演示</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#20232b;--muted:#7e8490;--line:#e7e9ef;--brand:#5865ed;--soft:#f0efff}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit}.guide{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr);padding:14px;gap:14px}.sidebar{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 12px 35px #3138590a;overflow:hidden}.brand{padding:24px 22px 18px;border-bottom:1px solid #f0f1f4}.brand-mark{width:39px;height:39px;display:grid;place-items:center;margin-bottom:14px;border-radius:12px;color:#fff;font-size:19px;font-weight:700;background:linear-gradient(135deg,#7d5ee9,#4f70f5);box-shadow:0 8px 18px #5968e735}.brand h1{font-size:18px;margin:0 0 4px}.brand p{font-size:12px;color:var(--muted);margin:0}.menu-label{padding:17px 22px 8px;color:#a0a4ad;font-size:11px;letter-spacing:.08em}.menu{padding:0 10px;display:flex;flex-direction:column;gap:5px}.menu-item{position:relative;width:100%;display:grid;grid-template-columns:38px 1fr 14px;align-items:center;gap:9px;padding:12px;border:0;border-radius:13px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:.18s}.menu-item:hover{background:#f7f7fa}.menu-item.active{background:var(--soft);color:#4549b8}.menu-item.active:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:9px;background:var(--brand)}.icon{width:35px;height:35px;display:grid;place-items:center;border:1px solid #e8e9ef;border-radius:10px;background:#fff;color:#666f7d;font-size:15px}.active .icon{border-color:#d6d2ff;color:#5756d7;box-shadow:0 4px 12px #665ee516}.copy b{display:block;font-size:13px}.copy small{display:block;margin-top:1px;color:#969ba5;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#b6bac2}.sidebar-foot{margin-top:auto;padding:17px 20px;border-top:1px solid #f0f1f4;color:#a2a6af;font-size:10px}.stage{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 12px 35px #3138590a;overflow:hidden}.frame-wrap{position:relative;flex:1;min-height:0;background:#f7f8fc}.loading{position:absolute;z-index:0;inset:0;display:grid;place-items:center;color:#9ba0aa;font-size:12px}.loading:before{content:'';width:24px;height:24px;margin-right:-24px;border:2px solid #e2e4ea;border-top-color:#665ee8;border-radius:50%;animation:spin .8s linear infinite;transform:translateY(-25px)}iframe{position:relative;z-index:1;width:100%;height:100%;display:block;border:0;background:#f7f8fc}@keyframes spin{to{transform:translateY(-25px) rotate(360deg)}}@media(max-width:820px){.guide{grid-template-columns:84px minmax(0,1fr);padding:8px;gap:8px}.sidebar{border-radius:16px}.brand{padding:15px 10px}.brand-mark{margin:0 auto}.brand h1,.brand p,.menu-label,.copy,.arrow,.sidebar-foot{display:none}.menu{padding:10px}.menu-item{display:grid;grid-template-columns:1fr;padding:8px}.icon{margin:auto}.menu-item.active:before{top:9px;bottom:9px}.stage{border-radius:16px}}@media(max-width:520px){.guide{grid-template-columns:1fr;grid-template-rows:72px minmax(0,1fr)}.sidebar{display:block;white-space:nowrap;overflow-x:auto}.brand,.menu-label,.sidebar-foot{display:none}.menu{height:70px;display:flex;flex-direction:row;align-items:center;padding:8px;gap:5px}.menu-item{width:58px;flex:0 0 58px;display:block;padding:7px}.menu-item.active:before{left:12px;right:12px;top:auto;bottom:1px;width:auto;height:3px}.icon{width:34px;height:34px}}
</style>
</head>
<body>
<div class="guide">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">L</div><h1>AI 开发能力演示</h1><p>选择一种能力，查看完整交互流程</p></div>
    <div class="menu-label">能力类型</div>
    <nav class="menu" aria-label="Mock UI 类型">
      <button class="menu-item active" data-src="原型探索.html" data-title="原型探索" data-slogan="构想即原型"><span class="icon">▣</span><span class="copy"><b>原型探索</b><small>构想即原型</small></span><span class="arrow">›</span></button>
      <button class="menu-item" data-src="通用应用开发.html" data-title="通用应用开发" data-slogan="描述即系统"><span class="icon">◇</span><span class="copy"><b>通用应用开发</b><small>描述即系统</small></span><span class="arrow">›</span></button>
      <button class="menu-item" data-src="苍穹开发.html" data-title="苍穹应用开发" data-slogan="需求即应用"><span class="icon">〈/〉</span><span class="copy"><b>苍穹应用开发</b><small>需求即应用</small></span><span class="arrow">›</span></button>
      <button class="menu-item" data-src="技能开发.html" data-title="技能开发" data-slogan="经验即技能"><span class="icon">◉</span><span class="copy"><b>技能开发</b><small>经验即技能</small></span><span class="arrow">›</span></button>
      <button class="menu-item" data-src="智能体开发.html" data-title="智能体开发" data-slogan="角色即智能体"><span class="icon">♙</span><span class="copy"><b>智能体开发</b><small>角色即智能体</small></span><span class="arrow">›</span></button>
    </nav>
    <div class="sidebar-foot">内容为功能预览演示，请注意甄别</div>
  </aside>
  <main class="stage">
    <div class="frame-wrap"><div class="loading">正在加载演示</div><iframe id="demoFrame" src="原型探索.html" title="原型探索 Mock UI" loading="eager"></iframe></div>
  </main>
</div>
<script>
'use strict';
const frame=document.getElementById('demoFrame'),items=[...document.querySelectorAll('.menu-item')];
function openDemo(item){items.forEach(button=>button.classList.toggle('active',button===item));frame.title=item.dataset.title+' Mock UI';if(frame.getAttribute('src')!==item.dataset.src)frame.src=item.dataset.src}
items.forEach(item=>item.addEventListener('click',()=>openDemo(item)));
</script>
</body>
</html>
